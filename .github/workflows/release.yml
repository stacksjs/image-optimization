name: Release macOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-macos
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      APP_STORE_CONNECT_API_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pantry-pm/pantry/packages/action@e632b04fb1a8093e7c940c1dbd8ae4fb9b09bf5d
        with:
          version: '0.11.130'
          install: 'false'
          packages: bun.com@1.4.4 craft-native.org@0.0.350.1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests
      - run: ./buddy build
      - run: bun run test:e2e
      - name: Check native payload, architecture and bundle budget
        run: |
          file dist/ImageOptimization.app/Contents/MacOS/ImageOptimization | grep 'Mach-O.*arm64'
          file dist/ImageOptimization.app/Contents/MacOS/stx-backend | grep 'Mach-O.*arm64'
          test -z "$(git ls-files '*.swift' '*.kt' '*.kts' '*.xcodeproj/*' '*.xcworkspace/*')"
          test "$(du -sk dist/ImageOptimization.app | cut -f1)" -lt 100000
      - name: Import signing identity into an ephemeral keychain
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/imageoptimization.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm "$RUNNER_TEMP/signing.p12"
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple the DMG
        run: bun run package
        env:
          RELEASE: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Verify distributable
        run: |
          codesign --verify --deep --strict --verbose=2 dist/direct/ImageOptimization.app
          codesign --verify --strict --verbose=2 dist/direct/*.dmg
          xcrun stapler validate dist/direct/*.dmg
          spctl --assess --type execute --verbose=2 dist/direct/ImageOptimization.app
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/direct/*.dmg
          test "$(du -sk dist/direct/ImageOptimization.app | cut -f1)" -lt 100000
          (cd dist/direct && shasum -a 256 *.dmg) > dist/direct/SHA256SUMS.txt
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(bun -p "require('./package.json').version")"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/direct/*.dmg dist/direct/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/direct/*.dmg dist/direct/SHA256SUMS.txt --target "$GITHUB_SHA" --title "ImageOptimization $VERSION" --generate-notes
          fi
      - name: Prepare store metadata and screenshots
        run: bun run store:prepare
        env:
          APPLE_REVIEW_CONTACT: ${{ secrets.APPLE_REVIEW_CONTACT }}
      - name: Import Mac App Store signing assets
        env:
          APPLICATION_CERTIFICATE: ${{ secrets.APPLE_STORE_APPLICATION_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE: ${{ secrets.APPLE_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_STORE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_STORE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/imageoptimization-store.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$RUNNER_TEMP/imageoptimization.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
          printf '%s' "$APPLICATION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/store-app.p12"
          printf '%s' "$INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/store-installer.p12"
          security import "$RUNNER_TEMP/store-app.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/store-installer.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep 19E6B67993578B0F8B305446F14A182588C094D1
          security find-identity -v -p basic "$KEYCHAIN" | grep CCFDD78721D27D99E7CC0C2FC780610367046C37
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/store.provisionprofile"
          chmod 600 "$RUNNER_TEMP/store.provisionprofile"
          echo "APPLE_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "APPLE_PROVISIONING_PROFILE=$RUNNER_TEMP/store.provisionprofile" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "API_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys" >> "$GITHUB_ENV"
      - name: Create and validate sandboxed store package
        env:
          DISTRIBUTION: app-store
          RELEASE: '1'
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          APPLE_SIGNING_IDENTITY: 19E6B67993578B0F8B305446F14A182588C094D1
          APPLE_INSTALLER_IDENTITY: CCFDD78721D27D99E7CC0C2FC780610367046C37
        run: |
          bun run package
          codesign --verify --deep --strict dist/app-store/ImageOptimization.app
          test "$(du -sk dist/app-store/ImageOptimization.app | cut -f1)" -lt 100000
          pkgutil --check-signature dist/app-store/*.pkg
          xcrun altool --validate-app --type osx --file dist/app-store/*.pkg --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Upload and submit the App Store version
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          APPLE_REVIEW_CONTACT: ${{ secrets.APPLE_REVIEW_CONTACT }}
        run: |
          xcrun altool --upload-app --type osx --file dist/app-store/*.pkg --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          bun scripts/publish-store.ts
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/imageoptimization.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/imageoptimization-store.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/store-app.p12" "$RUNNER_TEMP/store-installer.p12" "$RUNNER_TEMP/store.provisionprofile" "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
