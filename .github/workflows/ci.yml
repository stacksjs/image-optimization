name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pantry-pm/pantry/packages/action@e632b04fb1a8093e7c940c1dbd8ae4fb9b09bf5d
        with:
          version: '0.11.130'
          install: 'false'
          packages: bun.com@1.4.4 craft-native.org@0.0.350.1
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test tests
      - run: ./buddy build
      - run: bun run test:e2e
      - name: Check native payload and source boundary
        run: |
          file dist/ImageOptimization.app/Contents/MacOS/ImageOptimization | grep 'Mach-O.*arm64'
          file dist/ImageOptimization.app/Contents/MacOS/stx-backend | grep 'Mach-O.*arm64'
          test -z "$(git ls-files '*.swift' '*.kt' '*.kts' '*.xcodeproj/*' '*.xcworkspace/*')"
          test "$(du -sk dist/ImageOptimization.app | cut -f1)" -lt 100000
      - name: Archive the native app with executable permissions
        run: ditto -c -k --keepParent dist/ImageOptimization.app dist/ImageOptimization.zip
      - uses: actions/upload-artifact@v6
        with:
          name: ImageOptimization-app
          path: dist/ImageOptimization.zip
